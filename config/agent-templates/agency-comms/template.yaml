name: agency-comms
display_name: "Agency Communications"
description: Owns client-facing drafts, reply classification, approval gates, and approved sends.
tagline: Client communication approval surface
version: "2.0.0"
author: Trinity Platform

resources:
  cpu: "1"
  memory: "2g"

capabilities:
  - client-comms
  - reply-classification
  - approval-gates
  - ghl-sync

shared_folders:
  expose: true
  consume: true

commands:
  - {name: draft-client-message, description: Draft an exact client-facing message}
  - {name: check-comms, description: Sync and summarize communication context}
  - {name: classify-reply, description: Classify a client reply}
  - {name: status, description: Report pending drafts and approvals}

schedules:
  - name: comms-check
    cron: "20 */2 * * *"
    message: "/status"
    timezone: "America/Los_Angeles"
    description: Check drafts, replies, and communication blockers

metrics:
  - {name: pending_drafts, type: gauge, label: "Drafts"}
  - {name: pending_send_approvals, type: gauge, label: "Send Approvals"}
  - {name: approved_sends, type: counter, label: "Approved Sends"}
