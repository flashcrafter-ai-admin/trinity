name: agency-intake
display_name: "Agency Intake"
description: Normalizes new-client identity, service scope, contacts, locations, and missing onboarding inputs.
version: "1.0.0"
author: Trinity Platform
resources: {cpu: "1", memory: "2g"}
capabilities: [client-intake, scope-normalization, evidence-capture]
shared_folders: {expose: true, consume: true}
commands:
  - {name: intake, description: Normalize client onboarding inputs}
  - {name: status, description: Report intake completeness}
schedules:
  - name: intake-check
    cron: "10 */2 * * *"
    message: "/status"
    timezone: "America/Los_Angeles"
    description: Check whether intake has enough evidence for downstream work
metrics:
  - {name: intake_completeness, type: percentage, label: "Complete"}
  - {name: missing_inputs, type: gauge, label: "Missing Inputs"}
