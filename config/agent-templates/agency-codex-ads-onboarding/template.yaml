name: agency-codex-ads-onboarding
display_name: "Agency Ads Onboarding (Codex)"
description: Prepares Google Ads launch readiness with tracking evidence, dry-run plans, approval gates, and maintenance handoff.
version: "1.0.0"
author: Trinity Platform
resources: {cpu: "2", memory: "4g"}
capabilities: [google-ads-onboarding, tracking-readiness, change-plans]
shared_folders: {expose: true, consume: true}
commands:
  - {name: ads-plan, description: Build Google Ads onboarding plan}
  - {name: ads-readiness, description: Verify Ads launch readiness}
  - {name: status, description: Report Ads blockers and gates}
schedules:
  - name: ads-readiness-check
    cron: "40 */2 * * *"
    message: "/status"
    timezone: "America/Los_Angeles"
metrics:
  - {name: ads_blockers, type: gauge, label: "Ads Blockers"}
  - {name: ads_readiness, type: percentage, label: "Ads Ready"}


runtime:
  type: codex-cli
  model: gpt-5.5
