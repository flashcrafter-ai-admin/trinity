name: agency-codex-ads-maintenance
display_name: "Agency Ads Maintenance (Codex)"
description: Owns post-launch Google Ads and LSA monitoring, read-only scans, change plans, and gated optimizations.
version: "1.0.0"
author: Trinity Platform
resources: {cpu: "2", memory: "4g"}
capabilities: [ads-maintenance, lsa-monitoring, read-only-scans, gated-optimizations]
shared_folders: {expose: true, consume: true}
commands:
  - {name: ads-scan, description: Run a read-only ads/LSA maintenance scan}
  - {name: optimization-plan, description: Draft gated optimization actions}
  - {name: status, description: Report maintenance state}
schedules:
  - name: ads-maintenance-scan
    cron: "15 9 * * 1-5"
    message: "/ads-scan"
    timezone: "America/Los_Angeles"
metrics:
  - {name: ads_alerts, type: gauge, label: "Ads Alerts"}
  - {name: pending_optimizations, type: gauge, label: "Optimizations"}


runtime:
  type: codex-cli
  model: gpt-5.5
