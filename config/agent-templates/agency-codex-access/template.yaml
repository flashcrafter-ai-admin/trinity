name: agency-codex-access
display_name: "Agency Access (Codex)"
description: Tracks client access grants, admin prerequisites, and critical access gates for onboarding.
version: "1.0.0"
author: Trinity Platform
resources: {cpu: "1", memory: "2g"}
capabilities: [access-readiness, admin-gates, prerequisite-tracking]
shared_folders: {expose: true, consume: true}
commands:
  - {name: access-matrix, description: Build or refresh required access matrix}
  - {name: status, description: Report access blockers}
schedules:
  - name: access-check
    cron: "30 */2 * * *"
    message: "/status"
    timezone: "America/Los_Angeles"
    description: Check missing access and admin-level blockers
metrics:
  - {name: missing_access_items, type: gauge, label: "Missing Access"}
  - {name: admin_gates, type: gauge, label: "Admin Gates"}


runtime:
  type: codex-cli
  model: gpt-5.5
