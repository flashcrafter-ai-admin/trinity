name: agency-website-seo-onboarding
display_name: "Agency Website SEO Onboarding"
description: Prepares website, landing page, tracking, local SEO, GBP/reviews evidence, QA, deployment gates, and maintenance handoff.
version: "1.0.0"
author: Trinity Platform
resources: {cpu: "2", memory: "4g"}
capabilities: [website-onboarding, local-seo, launch-readiness]
shared_folders: {expose: true, consume: true}
commands:
  - {name: web-seo-plan, description: Build website and SEO onboarding plan}
  - {name: launch-readiness, description: Verify website/SEO launch readiness}
  - {name: status, description: Report website/SEO blockers}
schedules:
  - name: website-seo-check
    cron: "5 1-23/2 * * *"
    message: "/status"
    timezone: "America/Los_Angeles"
metrics:
  - {name: website_blockers, type: gauge, label: "Web Blockers"}
  - {name: seo_readiness, type: percentage, label: "SEO Ready"}
