schema_version: agency.pipeline.v1
pipeline_id: client-onboarding
description: End-to-end agency client onboarding workflow owned by the Agency Orchestrator.
authority:
  workflow_owner: agency-orchestrator
  state_path: ~/.trinity/pipeline-state/client-onboarding/<client-slug>.json
  shared_projection: /home/developer/shared-out/pipeline/onboarding-state.json
principles:
  - agent-owned-state
  - evidence-required
  - operator-gated-critical-edge
  - idempotent-side-effects
  - loud-drift-detection
stages:
  - id: intake
    owner: agency-intake
    required_evidence:
      - client identity and slug
      - primary contact
      - service scope
      - selected tracks
    next: access-readiness
  - id: access-readiness
    owner: agency-access
    required_evidence:
      - required grants matrix
      - missing access list
      - admin-critical gates
    next: track-planning
  - id: track-planning
    owner: agency-orchestrator
    children:
      - agency-ads-onboarding
      - agency-lsa-onboarding
      - agency-website-seo-onboarding
    required_evidence:
      - track plans or explicit not-applicable reasons
    next: implementation-readiness
  - id: implementation-readiness
    owner: agency-orchestrator
    gates:
      - external client sends
      - spend or bidding changes
      - launches or publishing
      - admin or credential changes
    next: qa
  - id: qa
    owner: agency-reporting-qa
    required_evidence:
      - readiness report
      - open blockers
      - drift check
    next: handoff
  - id: handoff
    owner: agency-orchestrator
    required_evidence:
      - client-ready status
      - maintenance handoff
      - next scheduled actions
    terminal: true
