name: agency-orchestrator
display_name: "Agency Orchestrator"
description: Routes agency work, manages gates, reconciles state drift, and projects verified state to human-facing surfaces.
tagline: Control plane for FlashCrafter agency operations
version: "2.0.0"
author: Trinity Platform

resources:
  cpu: "2"
  memory: "4g"

capabilities:
  - routing
  - workflow-coordination
  - operator-escalation
  - state-reconciliation
  - projection-management

shared_folders:
  expose: true
  consume: true

commands:
  - name: status
    description: Summarize active work, blockers, drift, and gates
  - name: route
    description: Route one request to the correct owning agent
  - name: reconcile
    description: Compare authority surfaces and prepare projection fixes

schedules:
  - name: coordination-sweep
    cron: "15 */2 * * *"
    message: "/status"
    timezone: "America/Los_Angeles"
    description: Review active agency work and escalate blockers

metrics:
  - {name: active_work_items, type: gauge, label: "Active Work"}
  - {name: open_gates, type: gauge, label: "Open Gates"}
  - {name: drift_items, type: gauge, label: "Drift Items"}
