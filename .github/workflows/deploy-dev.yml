name: Deploy to Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an upgrade after its backup/build sequence has started.
concurrency:
  group: trinity-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Connect to Tailscale
        # SHA-pinned to mitigate supply-chain hijack of a floating tag.
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ secrets.TS_TAGS }}

      - name: Configure deploy SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEV_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/trinity-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          test -s "$HOME/.ssh/trinity-deploy"
          test -s "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/trinity-deploy" >/dev/null

      - name: Deploy pushed revision safely
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_PORT: ${{ secrets.DEV_PORT }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          set -euo pipefail
          test -n "$DEV_HOST"
          test -n "$DEV_PORT"
          test -n "$DEV_USER"
          ssh \
            -i "$HOME/.ssh/trinity-deploy" \
            -p "$DEV_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEV_USER@$DEV_HOST" \
            "deploy $GITHUB_SHA"
